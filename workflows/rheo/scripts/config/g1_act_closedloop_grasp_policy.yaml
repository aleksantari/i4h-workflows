# ACT closed-loop policy config for grasp_policy evaluation
# Used by: ACTClosedloopPolicy in simulation/act_closedloop_policy.py

# Path to trained ACT checkpoint (LeRobot format)
model_path: "/models/act_grasp_policy"

# Action chunking
action_chunk_length: 100  # Must match policy.chunk_size from training config

# Task description
language_instruction: "pick up block and place in bin"

# Action dimensions
policy_action_dim: 28  # ACT output: left_arm(7) + right_arm(7) + left_hand(7) + right_hand(7)
sim_action_dim: 43     # Full robot: legs(12) + waist(3) + arms(14) + hands(14)

# Image configuration
target_image_size: [480, 640, 3]
