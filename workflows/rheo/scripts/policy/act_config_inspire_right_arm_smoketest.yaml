# ACT single-episode memorization smoketest — right-arm 13D.
#
# Purpose: verify the end-to-end pipeline (data → train → scatter → sim) by
# overfitting one teleop demo. Pair with eval at the matching slot + tool on
# the deterministic `-Joint-Eval` task variant. If the model reproduces the
# recorded trajectory, the pipeline is sound; any remaining eval failure is a
# learning/data problem.
#
# Key departures from act_config_inspire_right_arm.yaml:
#   - use_vae: false → deterministic encoder-decoder, no train/eval z mismatch
#   - kl_weight: 0 (moot when use_vae=false, kept for clarity)
#   - dataset.episodes: [28] → train on one demo
#   - steps: 5000, batch_size: 32 → tight budget, many updates per frame

experiment:
  cameras:
    front_camera: "observation.images.cam_room"
    right_wrist_camera: "observation.images.cam_right_wrist"
  joint_groups:
    - right_arm
    - right_hand

seed: 1000

wandb:
  enable: true
  project: "rheo-act-inspire"
  disable_artifact: false

dataset:
  repo_id: placeholder
  # Single-episode dataset is pre-extracted via
  # scripts/utils/extract_single_episode.py. Don't set `episodes:` here —
  # LeRobot 0.1.0's episode_data_index lookup is broken for sparse filters.

steps: 5000
batch_size: 32
eval_freq: 5000
save_freq: 1000
log_freq: 50
save_checkpoint: true
num_workers: 8

eval:
  n_episodes: 1
  batch_size: 1

policy:
  type: act

  chunk_size: 50
  n_action_steps: 50
  n_obs_steps: 1

  dim_model: 256
  n_heads: 8
  dim_feedforward: 1600
  feedforward_activation: relu
  n_encoder_layers: 2
  n_decoder_layers: 1

  use_vae: false
  latent_dim: 32
  n_vae_encoder_layers: 2
  kl_weight: 0

  input_features:
    observation.state:
      type: STATE
      shape: [13]
    observation.images.cam_room:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.cam_right_wrist:
      type: VISUAL
      shape: [3, 480, 640]
  output_features:
    action:
      type: ACTION
      shape: [13]

  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MEAN_STD
    ACTION: MEAN_STD

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  replace_final_stride_with_dilation: false

  push_to_hub: false

  optimizer_lr: 2e-5
  optimizer_weight_decay: 1e-4
  optimizer_lr_backbone: 2e-5
